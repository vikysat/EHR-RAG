# Citation-checker RULES (frozen before the test run; its SHA-256 is recorded in every run's
# run_meta.json). Vocabulary (synonyms, abbreviations, lab-derived terms) is in
# config/checker_lexicon.yaml. Matching is case-insensitive unless stated otherwise.
version: 1

# too_many_citations: more citations than this on one claim (list items are claims)
max_citations: 3

number:
  # Numbers inside any of these patterns are not clinical numbers and are not checked.
  # Citation ids are removed by the parser before checking; ISO dates and clock times
  # are always removed (perturb.select_targets.numbers_in).
  ignore_patterns:
    age: '\b\d{1,3}\s*-?\s*(?:years?|yrs?|y)\s*-?\s*(?:old|o)\b|\b(?:aged?|age of)\s+\d{1,3}\b|\b\d{1,3}\s*(?:yo|y/o|y\.o\.)(?![a-z])'
    date: '\b\d{1,2}/\d{1,2}(?:/\d{2,4})?\b|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s+\d{4})?\b|\b(?:in|on|since|during|of|year)\s+(?:19|20|21|22)\d{2}\b|\b(?:19|20|21|22)\d{2}\s*-\s*(?:19|20|21|22)\d{2}\b'
    section_or_list: '^\s*\d+[.)]\s|\b(?:section|step|item|part|phase)\s+\d+\b'
    duration: '\b(?:hospital\s+|post-?operative\s+|hd\s*)?day\s+\d+\b|\b\d+(?:\.\d+)?\s*-?\s*(?:days?|hours?|hrs?|h|weeks?|wks?|months?|minutes?|mins?)\b'
    icd_version: '\bICD-?(?:9|10)(?:-CM|-PCS)?\b'
  # a stated number matches a unit value if equal, or if the unit value rounded
  # (half-up) to the stated number's decimal places equals it (5.94 -> "5.9", 5.9 -> "6")
  allow_rounding: true

direction:
  window_tokens: 3          # direction word at most this many tokens from the lab name
  high: [elevated, high, higher, increased, raised, abnormally high, above normal, supranormal]
  low: [low, lower, decreased, reduced, depressed, diminished, below normal, abnormally low]
  normal: [normal, within normal limits, wnl, unremarkable, within normal range, in the normal range]

negation:                   # keep 'no' quoted (bare no is YAML false)
  window_tokens: 3          # cue at most this many tokens before the claim
  cues: ['no', not, without, negative for, absence of, absent, denies, denied, free of, resolved, ruled out, rules out]

trend:
  window_tokens: 4
  up: [rising, rose, increasing, uptrending, up-trending, trending up, trended up, climbing, climbed, uptrend]
  down: [falling, fell, decreasing, declining, declined, downtrending, down-trending, trending down, trended down, dropping, dropped, downtrend]
  improving: [improving, improved, improvement]
  worsening: [worsening, worsened, deteriorating]
  undirected: [trending, trended, fluctuating]
