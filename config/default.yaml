data:
  source: demo                 # demo | full
  root: data/mimic-iv-clinical-database-demo-2.2
  derived: data/derived

selection:
  min_distinct_labs: 10
  min_abnormal_labs: 3
  min_distinct_drugs: 5
  min_diagnoses: 3
  n_admissions: 15

cohort:                        # select-cohort / extract-cohort (full MIMIC-IV, DuckDB)
  mimic_root: data/mimiciv     # full MIMIC-IV (hosp/*.csv.gz); symlink on the cluster
  note_root: data/mimic-iv-note   # MIMIC-IV-Note (note/discharge.csv.gz); symlink on the cluster
  demo_root: data/mimic-iv-clinical-database-demo-2.2   # subject ids to exclude; reference columns
  out_dir: data/cohort         # gitignored: id lists, extracted Parquet, reference notes
  pool_fraction: 0.1           # seeded share of all subject_ids
  seed: 13
  min_los_days: 2              # hospital stay, inclusive bounds
  max_los_days: 14
  min_prior_admissions: 1
  min_lab_results: 20          # labevents rows with this hadm_id
  n_dev: 20
  n_test: 100

units:
  max_prior_admissions: 3
  max_history_dx_per_admission: 5

retrieval:
  dense_query_model: ncbi/MedCPT-Query-Encoder
  dense_doc_model: ncbi/MedCPT-Article-Encoder
  rrf_k: 60
  top_k_per_query: 5
  max_units_per_section: 10
  max_units_total: 30
  rerank: false
  rerank_model: ncbi/MedCPT-Cross-Encoder
  relevance_export_pairs: 10
  queries:
    History:
      - "past medical history and prior diagnoses"
      - "chronic conditions related to {primary_dx}"
    Findings:
      - "laboratory results high low"
      - "blood test values {primary_dx}"
      - "procedures performed during admission"
    Impression:
      - "primary diagnosis {primary_dx}"
      - "secondary diagnoses and complications"
    Recommendations:
      - "medications drugs dose route administered"
      - "treatment for {primary_dx}"

generation:
  backend: hf_local             # anthropic | openai_compatible | hf_local  (REQUIRED)
  model: meta-llama/Llama-3.1-8B-Instruct   # REQUIRED
  base_url: null
  api_key_env: null            # API backends only: env var holding the key
  temperature: 0.0
  max_tokens: 4096             # hf_local: max_new_tokens
  prompt_version: report_v1
  conditions: [no_retrieval, ehr_rag, full_context]
  max_context_tokens: 32000     # full_context: whole templated prompt, model tokenizer
  confirm_threshold: 20
  endpoint_is_physionet_compliant: false

eval:
  nli_model: cross-encoder/nli-deberta-v3-base   # verify it loads; read id2label
  manual_review_n: 100
  seed: 13
  bertscore_model: roberta-large   # text-metrics --bertscore; local HF cache only (offline)
  bertscore_layer: 17             # bert-score's default layer for roberta-large

checker:                       # citation checker + enforcement; frozen, hashes in every run_meta.json
  rules: config/checker.yaml
  lexicon: config/checker_lexicon.yaml
  rewrite_prompt: rewrite_v1   # prompts/rewrite_v1.txt (one-sentence rewrite)

audit:                         # counterfactual citation audit: audit-targets / run-audit / analyze-audit
  n_cited_per_admission: 3     # lab units cited in the plain ehr_rag report; HIGH/LOW-flagged first
  n_null_per_admission: 1      # a shown lab unit cited nowhere in the report (null edit)
  seed: 13
  # flagged unit -> every measurement to the midpoint of the reference range;
  # normal unit -> every measurement to bound +/- outside_fraction * (ref_high - ref_low):
  # above ref_high, or below ref_low for these lab groups (checker lexicon keys)
  outside_fraction: 0.5
  below_range_groups: [hemoglobin, hematocrit, platelet, albumin]
  bootstrap_resamples: 1000    # faithfulness CIs, resampling admissions
  manual_check_n: 50

probe:                         # citation-dependence probe: probe-targets / run-probe / probe-threshold / analyze-probe
  seed: 13
  within_flag_percent: [10, 20]  # within-flag edit: every shown value x (1 +/- pct/100), markers kept
  batch_size: 4                # sequences per forward pass (run-probe, hf_local)
  threshold_quantile: 0.95     # "not dependent" threshold: this quantile of the DEV null + within-flag drops
  threshold_file: config/probe_threshold.yaml   # written by probe-threshold (with its sha256); test runs need it
  bootstrap_resamples: 1000    # CIs, resampling admissions
  # Physiologic plausibility bounds per checker lab group (MIMIC-IV default units); edited values are
  # clamped into them and never below 0. A mapping uom -> [low, high] for groups reported in several units.
  physiologic_bounds:
    potassium: [1.0, 10.0]
    sodium: [100, 185]
    chloride: [60, 140]
    bicarbonate: [3, 60]
    creatinine: [0.1, 25]
    urea nitrogen: [1, 250]
    hemoglobin: [2, 25]
    hematocrit: [6, 75]
    white blood cells: [0.1, 300]
    platelet: [1, 2000]
    inr: [0.5, 20]
    ptt: [15, 200]
    glucose: [10, 2000]
    magnesium: [0.3, 10]
    calcium: {mg/dL: [3, 20], mmol/L: [0.4, 4]}
    phosphate: [0.3, 20]
    albumin: [0.5, 7]
    ast: [1, 20000]
    alt: [1, 20000]
    alkaline phosphatase: [5, 5000]
    bilirubin: [0.1, 60]
    lactate: [0.2, 30]
    troponin: [0, 100]
    lipase: [1, 20000]
    ph: [6.5, 8.0]
    pco2: [5, 200]
    po2: [10, 700]
  # APPROXIMATE: drugs that can corroborate a lab-direction claim (substring of the drug name,
  # case-insensitive), per checker lab group and direction. Hand-written, not exhaustive; used
  # only to find units the corroborator ablation removes.
  related_drugs:
    potassium: {high: [sodium polystyrene, kayexalate, patiromer, zirconium], low: [potassium chloride, potassium phosphate, potassium bicarbonate, k-dur]}
    sodium: {low: [tolvaptan, sodium chloride 3, salt tab], high: [free water]}
    hemoglobin: {low: [ferrous, iron sucrose, epoetin, darbepoetin, red blood cells]}
    hematocrit: {low: [ferrous, iron sucrose, epoetin, darbepoetin, red blood cells]}
    glucose: {high: [insulin, glargine, lispro, aspart], low: [dextrose 50, glucagon]}
    magnesium: {low: [magnesium sulfate, magnesium oxide]}
    calcium: {low: [calcium gluconate, calcium carbonate, calcium chloride]}
    phosphate: {low: [potassium phosphate, sodium phosphate, k-phos, neutra-phos], high: [sevelamer, calcium acetate, lanthanum]}
    white blood cells: {low: [filgrastim]}
    platelet: {low: [platelets]}
    inr: {high: [phytonadione, vitamin k]}
    bicarbonate: {low: [sodium bicarbonate]}
    ph: {low: [sodium bicarbonate]}

perturbation:
  n_targets: 15
  max_targets_per_admission: 2
  edit_types: [lab_minor, lab_major, med_dose, delete]
  n_controls: 3
  seed: 13
